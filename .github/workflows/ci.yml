name: CI

on: [push, pull_request]

jobs:
  # This job downloads and stores `cross` as an artifact, so that it can be
  # redownloaded across all of the jobs. Currently this copied pasted between
  # `ci.yml` and `deploy.yml`. Make sure to update both places when making
  # changes.
  install-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: XAMPPRocky/get-github-release@f014caa45687655545637a005866289b3af8c69e # v1.0.4
        id: cross
        with:
          owner: rust-embedded
          repo: cross
          matches: ${{ matrix.platform }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-${{ matrix.platform }}
          path: ${{ steps.cross.outputs.install_path }}
    strategy:
      matrix:
        platform: [linux-musl]

  wasm-no-libc:
    runs-on: ubuntu-latest
    env:
      CRATE_CC_NO_DEFAULTS: 1
      CC_wasm32_unknown_unknown: /tmp/wasi-sdk-33.0-x86_64-linux/bin/clang --target=wasm32-unknown-unknown
      AR_wasm32_unknown_unknown: /tmp/wasi-sdk-33.0-x86_64-linux/bin/llvm-ar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - run: rustup target add wasm32-unknown-unknown
      - run: curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz | tar xz -C /tmp
      - run: cargo build --target wasm32-unknown-unknown --no-default-features --features stock-zlib
      - run: |
          archive=$(find target/wasm32-unknown-unknown/debug/build -path '*/out/lib/libz.a' -print -quit)
          test -n "$archive"
          ! /tmp/wasi-sdk-33.0-x86_64-linux/bin/llvm-nm -u "$archive" | grep -Eq ' U (malloc|free)$'

  wasm-wasi:
    runs-on: ubuntu-latest
    env:
      CC_wasm32_wasip1: /tmp/wasi-sdk-33.0-x86_64-linux/bin/clang
      AR_wasm32_wasip1: /tmp/wasi-sdk-33.0-x86_64-linux/bin/llvm-ar
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
      CC_wasm32_wasip1_threads: /tmp/wasi-sdk-33.0-x86_64-linux/bin/clang
      AR_wasm32_wasip1_threads: /tmp/wasi-sdk-33.0-x86_64-linux/bin/llvm-ar
      CC_wasm32_wasip2: /tmp/wasi-sdk-33.0-x86_64-linux/bin/clang
      AR_wasm32_wasip2: /tmp/wasi-sdk-33.0-x86_64-linux/bin/llvm-ar
      CARGO_TARGET_WASM32_WASIP2_RUNNER: wasmtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 46.0.1
      - run: rustup target add wasm32-wasip1 wasm32-wasip1-threads wasm32-wasip2
      - run: curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz | tar xz -C /tmp
      - run: cargo test --target wasm32-wasip1 --test wasm
      - run: cargo test --target wasm32-wasip2 --test wasm
      # The threads ABI imports shared memory, which needs a custom host.
      - run: cargo test --target wasm32-wasip1-threads --test wasm --no-run

  wasm-emscripten:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUNNER: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.4
      - run: rustup target add wasm32-unknown-emscripten
      - run: cargo test --target wasm32-unknown-emscripten --test wasm --features static

  windows:
    runs-on: ${{ matrix.runner || 'windows-latest' }}
    # Windows technically doesn't need this, but if we don't block windows on it
    # some of the windows jobs could fill up the concurrent job queue before
    # one of the install-cross jobs has started, so this makes sure all
    # artifacts are downloaded first.
    needs: install-cross
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - if: matrix.mingw_package
        uses: msys2/setup-msys2@7efe20baefed56359985e327d329042cde2434ff # v2
        with:
          release: false
          install: ${{ matrix.mingw_package }}
      - run: ci/set_rust_version.bash ${{ matrix.channel }} ${{ matrix.target }}
        shell: bash
      - run: ci/test.bash cargo ${{ matrix.target }}
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta, nightly]
        target:
          - x86_64-pc-windows-msvc
          - x86_64-pc-windows-gnu
          - i686-pc-windows-msvc
          - i686-pc-windows-gnu
          - aarch64-pc-windows-msvc
        include:
          - target: x86_64-pc-windows-gnu
            mingw_package: mingw-w64-x86_64-gcc
          - target: i686-pc-windows-gnu
            mingw_package: mingw-w64-i686-gcc
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm

  macos:
    runs-on: macos-latest
    # macOS isn't currently using this either, but see the note about Windows above.
    needs: install-cross
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - run: ci/set_rust_version.bash ${{ matrix.channel }} ${{ matrix.target }}
      - run: ci/test.bash cargo ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta, nightly]
        target:
          - x86_64-apple-darwin

  cc:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: test forced system libz
        run: ci/test-force-system.bash
      # Ensures --all-features builds correctly, the current logic will mean it
      # uses stock zlib, not cmake nor cc
      - run: |
          cargo test --all-features
          cargo run --manifest-path systest/Cargo.toml --all-features
      # Ensures zlib-ng builds and runs, though zlib-ng _could_ change internally
      # and not use all optimizations available to the CI runner, we do this here
      # just for x86_64-unknown-linux-gnu to validate a common target compiles
      # on a more recent compiler than the incredibly ancient one currently used by cross
      - run: |
          cargo test --no-default-features --features zlib-ng-no-cmake-experimental-community-maintained || echo "::warning::failed to build libz-ng with --features zlib-ng-no-cmake-experimental-community-maintained"
          cargo run --manifest-path systest/Cargo.toml --no-default-features --features zlib-ng-no-cmake-experimental-community-maintained || echo "::warning::failed to run systest with --features zlib-ng-no-cmake-experimental-community-maintained"

  # ensures packaging works
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: test bare packaging
        run: |
          cargo package --all-features
          cargo package --no-default-features --features zlib-ng-no-cmake-experimental-community-maintained
          cargo package --no-default-features --features zlib-ng
      - name: test packaging with release tool
        run: cargo run -p maint -- publish

  linux:
    runs-on: ubuntu-latest
    needs: install-cross
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Download Cross
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cross-linux-musl
          path: /tmp/
      - run: chmod +x /tmp/cross
      - run: ci/set_rust_version.bash ${{ matrix.channel }} ${{ matrix.target }}
      - run: ci/test.bash /tmp/cross ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta, nightly]
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - arm-unknown-linux-gnueabihf
          - arm-unknown-linux-musleabihf
          - i686-unknown-linux-gnu
          - i686-unknown-linux-musl
          - s390x-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl

  minimal-versions:
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          cargo +nightly update -Zminimal-versions

      - run: cargo build
      - run: cargo build --features zlib-ng --no-default-features
      - run: cargo build --no-default-features --features zlib-ng-no-cmake-experimental-community-maintained || echo "::warning::failed to build libz-ng with --features zlib-ng-no-cmake-experimental-community-maintained"

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - macos-latest
          - ubuntu-latest
